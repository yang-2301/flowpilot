<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="#1f2328">flowpilot — config-driven automation engine</text>
  <text x="40" y="64" font-size="13" fill="#57606a">Declarative pipelines · four step types · exponential backoff · dead-letter queue · one-click replay</text>

  <!-- triggers -->
  <rect x="40" y="96" width="180" height="88" rx="9" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="130" y="122" font-size="12.5" text-anchor="middle" fill="#0969da" font-weight="600">Triggers</text>
  <text x="130" y="144" font-size="11" text-anchor="middle" fill="#57606a">webhook (POST /hooks/…)</text>
  <text x="130" y="162" font-size="11" text-anchor="middle" fill="#57606a">interval (cron-like)</text>
  <text x="130" y="178" font-size="11" text-anchor="middle" fill="#57606a">manual run from UI</text>

  <!-- engine -->
  <rect x="260" y="88" width="220" height="104" rx="9" fill="#fbefff" stroke="#c297ff"/>
  <text x="370" y="114" font-size="12.5" text-anchor="middle" fill="#8250df" font-weight="600">Run engine</text>
  <text x="370" y="136" font-size="11" text-anchor="middle" fill="#57606a">loads pipeline JSON</text>
  <text x="370" y="154" font-size="11" text-anchor="middle" fill="#57606a">executes steps in order</text>
  <text x="370" y="172" font-size="11" text-anchor="middle" fill="#57606a">threadpool for blocking I/O</text>

  <line x1="222" y1="140" x2="256" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- steps -->
  <rect x="520" y="84" width="200" height="112" rx="9" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="620" y="110" font-size="12.5" text-anchor="middle" fill="#1a7f37" font-weight="600">Step types</text>
  <text x="620" y="132" font-size="11" text-anchor="middle" fill="#57606a">transform — map/format data</text>
  <text x="620" y="150" font-size="11" text-anchor="middle" fill="#57606a">http_request — templated calls</text>
  <text x="620" y="168" font-size="11" text-anchor="middle" fill="#57606a">llm — completion (mock-able)</text>
  <text x="620" y="186" font-size="11" text-anchor="middle" fill="#57606a">condition — skip or continue</text>

  <line x1="482" y1="140" x2="516" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- resilience -->
  <rect x="760" y="84" width="180" height="112" rx="9" fill="#fff8e5" stroke="#d4a72c"/>
  <text x="850" y="110" font-size="12.5" text-anchor="middle" fill="#7d4e00" font-weight="600">Resilience</text>
  <text x="850" y="132" font-size="11" text-anchor="middle" fill="#57606a">retry × N</text>
  <text x="850" y="150" font-size="11" text-anchor="middle" fill="#57606a">exponential backoff</text>
  <text x="850" y="168" font-size="11" text-anchor="middle" fill="#57606a">success clears last_error</text>
  <text x="850" y="186" font-size="11" text-anchor="middle" fill="#57606a">per-step timeout</text>

  <line x1="722" y1="140" x2="756" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- run log -->
  <rect x="40" y="232" width="420" height="150" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="258" font-size="12.5" fill="#1f2328" font-weight="600">Run log — every step recorded</text>
  <rect x="60" y="272" width="380" height="26" rx="5" fill="#dafbe1"/>
  <text x="70" y="290" font-size="11" fill="#1a7f37">✓ step 1  transform   normalise payload</text>
  <rect x="60" y="304" width="380" height="26" rx="5" fill="#fff8e5"/>
  <text x="70" y="322" font-size="11" fill="#9a6700">↻ step 2  http_request  attempt 2/3 (backoff 2s)</text>
  <rect x="60" y="336" width="380" height="26" rx="5" fill="#dafbe1"/>
  <text x="70" y="354" font-size="11" fill="#1a7f37">✓ step 3  llm          drafted outreach</text>

  <!-- dead letter -->
  <rect x="500" y="232" width="440" height="150" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="520" y="258" font-size="12.5" fill="#1f2328" font-weight="600">Failure path</text>
  <rect x="520" y="272" width="180" height="40" rx="7" fill="#fff5f5" stroke="#cf222e"/>
  <text x="610" y="292" font-size="11.5" text-anchor="middle" fill="#cf222e" font-weight="600">retries exhausted</text>
  <text x="610" y="306" font-size="10.5" text-anchor="middle" fill="#57606a">status = failed</text>
  <rect x="740" y="272" width="180" height="40" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="830" y="292" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="600">dead letter</text>
  <text x="830" y="306" font-size="10.5" text-anchor="middle" fill="#57606a">kept with error context</text>
  <line x1="702" y1="292" x2="736" y2="292" stroke="#cf222e" stroke-width="1.5" marker-end="url(#r)"/>
  <rect x="520" y="328" width="400" height="38" rx="7" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="720" y="352" font-size="11.5" text-anchor="middle" fill="#0969da">replay → re-runs the same payload, fresh attempt counter</text>

  <!-- demo -->
  <rect x="40" y="412" width="420" height="96" rx="9" fill="#fbfcfd" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="60" y="436" font-size="12" fill="#1f2328" font-weight="600">Deterministic failure demo</text>
  <text x="60" y="458" font-size="11.5" fill="#57606a">/demo/flaky?bucket=… fails on a fixed schedule</text>
  <text x="60" y="478" font-size="11.5" fill="#57606a">so retry/backoff/dead-letter can be shown without a flaky network</text>

  <rect x="500" y="412" width="440" height="96" rx="9" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="520" y="436" font-size="12" fill="#0969da" font-weight="600">Vue UI  :5174</text>
  <text x="520" y="458" font-size="11.5" fill="#57606a">pipeline list · run history · step timeline</text>
  <text x="520" y="478" font-size="11.5" fill="#57606a">replay button wires straight to POST /api/runs/{id}/replay</text>

  <text x="40" y="546" font-size="11" fill="#8b949e">13 tests · pipelines are JSON, so adding one needs no code change</text>
</svg>
